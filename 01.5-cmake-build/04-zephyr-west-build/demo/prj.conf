# prj.conf = 这个应用的 Kconfig 配置（覆盖 Zephyr 默认值）
# 每行一个 CONFIG_ 选项，构建时会被合并进 .config，
# 再翻译成 autoconf.h 里的 #define——见 README 4.3 的完整链路

# 打开 GPIO 子系统：blinky 要点灯
# 效果链：CONFIG_GPIO=y → autoconf.h 有 #define CONFIG_GPIO 1
#         → drivers/gpio/ 下对应源文件被编进内核 target
CONFIG_GPIO=y

# 关掉用不到的子系统（Zephyr 默认很克制，这里演示"关"的写法）
CONFIG_CONSOLE=n
