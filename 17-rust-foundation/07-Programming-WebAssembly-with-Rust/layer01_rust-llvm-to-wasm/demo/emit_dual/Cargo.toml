# Layer 1 练手工程：同一份 Rust 源码，同时导出 LLVM IR(.ll) 与 Wasm(.wasm)
#
# 与 06_Compilers-and-LLVM-Learning/04_Learn-LLVM-17 的 llvm_insight_lab 是同一套打法，
# 只是把目标三元组从 host 换成 wasm32-unknown-unknown。

[package]
name = "emit-dual"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib → 产出 .wasm（导出给宿主）；rlib → 便于 cargo rustc 导出 .ll
crate-type = ["cdylib", "rlib"]

[dependencies]

# 刻意区分两个 profile：O0 看「源码怎么直译」，release 看「优化后剩什么」
[profile.release]
opt-level = 3
lto = false
